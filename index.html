<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1118" />
<meta name="mobile-web-app-capable" content="yes" />
<title>O Bagre</title>
<style>
  :root {
    --bg: #0b1118;
    --card: #121b26;
    --card-2: #172230;
    --card-3: #1d2b3d;
    --text: #eef3f8;
    --muted: #93a6bc;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --danger: #ef4444;
    --border: rgba(255, 255, 255, 0.09);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .app-shell {
    width: 100%;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: radial-gradient(circle at top, #142436 0%, var(--bg) 62%);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 10px) 12px env(safe-area-inset-bottom, 12px);
  }

  .screen {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .screen.active {
    display: flex;
  }

  /* TELA INICIAL */
  .start-screen {
    justify-content: space-between;
    align-items: center;
    padding: 28px 16px 14px;
    text-align: center;
  }

  .logo-box {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .title {
    margin: 0;
    font-size: 2.35rem;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 0;
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 290px;
    line-height: 1.4;
  }

  .btn-play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--accent);
    color: #052e16;
    border: none;
    border-radius: 999px;
    padding: 16px 38px;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(34, 197, 94, 0.32);
    min-height: 54px;
  }

  .btn-play:active {
    transform: scale(0.97);
    background: var(--accent-hover);
  }

  .ball-dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #052e16;
    display: inline-block;
  }

  .credit {
    font-size: 0.75rem;
    color: var(--muted);
    opacity: 0.85;
  }

  /* TELA DE CRIAÇÃO DO JOGADOR */
  .setup-screen {
    gap: 10px;
    padding-top: 6px;
  }

  .setup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .setup-header h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
  }

  .setup-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 2px;
  }

  .field-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .text-input {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.98rem;
    outline: none;
  }

  .text-input:focus {
    border-color: var(--accent);
  }

  .option-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px 12px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(34, 197, 94, 0.14);
  }

  .opt-main {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .opt-sub {
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .btn-confirm {
    width: 100%;
    background: var(--accent);
    color: #052e16;
    border: none;
    border-radius: 15px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    min-height: 50px;
  }

  /* TELA PRINCIPAL DO JOGO */
  .game-screen {
    gap: 8px;
    justify-content: space-between;
  }

  .top-player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 9px 12px;
  }

  .player-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--card-3);
    border: 1px solid rgba(255, 255, 255, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .player-name {
    font-size: 0.92rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-meta {
    font-size: 0.74rem;
    color: var(--muted);
  }

  .ovr-badge {
    background: rgba(34, 197, 94, 0.16);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.4);
    border-radius: 11px;
    padding: 6px 10px;
    font-weight: 900;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .morals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .moral-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px;
    text-align: center;
  }

  .moral-label {
    font-size: 0.65rem;
    color: var(--muted);
    display: block;
  }

  .moral-val {
    font-size: 0.88rem;
    font-weight: 800;
  }

  .club-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 0.8rem;
    gap: 8px;
  }

  .club-identity {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    min-width: 0;
  }

  .club-name-txt {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .color-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.28);
  }

  .standing-pill {
    color: var(--muted);
    font-weight: 700;
    font-size: 0.76rem;
    flex-shrink: 0;
  }

  .center-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event-card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.74rem;
    color: var(--muted);
  }

  .tag {
    background: rgba(255, 255, 255, 0.07);
    padding: 3px 9px;
    border-radius: 999px;
    color: #dbeafe;
    font-weight: 700;
  }

  .event-title {
    margin: 0;
    font-size: 1.08rem;
    line-height: 1.28;
  }

  .event-desc {
    margin: 0;
    font-size: 0.88rem;
    line-height: 1.45;
    color: #cbd5e1;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 2px;
  }

  .btn-choice {
    width: 100%;
    padding: 12px 14px;
    border-radius: 13px;
    border: 1px solid var(--border);
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    background: var(--card-2);
    color: var(--text);
    text-align: left;
    min-height: 46px;
  }

  .btn-choice.yes {
    background: rgba(34, 197, 94, 0.15);
    border-color: rgba(34, 197, 94, 0.45);
    color: #86efac;
  }

  .btn-choice.no {
    background: rgba(239, 68, 68, 0.14);
    border-color: rgba(239, 68, 68, 0.4);
    color: #fca5a5;
  }

  .outcome-box {
    background: rgba(255, 255, 255, 0.04);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .outcome-box.fail {
    border-left-color: var(--danger);
  }

  .bottom-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px;
  }

  .season-info {
    font-size: 0.76rem;
    color: var(--muted);
    font-weight: 600;
  }

  .btn-arrow {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #052e16;
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.28);
  }

  .btn-arrow:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    box-shadow: none;
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- 1. TELA INICIAL -->
  <section class="screen start-screen active" id="startScreen">
    <div class="logo-box">
      <svg width="98" height="98" viewBox="0 0 96 96" fill="none" aria-label="Logo O Bagre">
        <circle cx="48" cy="48" r="44" fill="#172230" stroke="#22c55e" stroke-width="2" />
        <path d="M20 46C28 32 46 30 60 40L72 32V60L60 52C46 62 28 60 20 46Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round" />
        <circle cx="31" cy="44" r="2.5" fill="#0b1118" />
        <circle cx="56" cy="64" r="11" fill="#ffffff" stroke="#0b1118" stroke-width="2" />
        <polygon points="56,57 61,61 59,67 53,67 51,61" fill="#0b1118" />
      </svg>
      <h1 class="title">O Bagre</h1>
      <p class="subtitle">Simulador minimalista da vida real de quem insiste na bola.</p>
    </div>

    <button class="btn-play" id="btnGoSetup">
      <span class="ball-dot"></span>
      <span>JOGAR</span>
    </button>

    <div class="credit">desenvolvido por Ronaldo Paz</div>
  </section>

  <!-- 2. TELA DE ESCOLHA (NOME, TIME/TRAMPO, ESTILO) -->
  <section class="screen setup-screen" id="setupScreen">
    <div class="setup-header">
      <h2>Montar Bagre</h2>
      <span class="credit">desenvolvido por Ronaldo Paz</span>
    </div>

    <div class="setup-scroll">
      <div class="field-group">
        <label class="field-label" for="inputName">Seu nome no jogo</label>
        <input class="text-input" id="inputName" type="text" maxlength="26" placeholder="Ex: Ronaldo Paz" value="Ronaldo Paz" />
      </div>

      <div class="field-group">
        <span class="field-label">Estilo do jogador</span>
        <div class="option-grid" id="styleOptions"></div>
      </div>

      <div class="field-group">
        <span class="field-label">Onde começa a temporada</span>
        <div class="option-grid" id="startOptions"></div>
      </div>
    </div>

    <button class="btn-confirm" id="btnStartCareer">Iniciar Carreira</button>
  </section>

  <!-- 3. TELA DO JOGO -->
  <main class="screen game-screen" id="gameScreen">
    <div class="top-player">
      <div class="player-left">
        <div class="avatar" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" fill="#cbd5e1" />
            <path d="M5 20C5 16.5 8.1 14 12 14C15.9 14 19 16.5 19 20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
        <div style="min-width:0;">
          <div class="player-name" id="playerName">Ronaldo Paz</div>
          <div class="player-meta" id="playerMeta">29 anos • Farrista</div>
        </div>
      </div>
      <div class="ovr-badge" id="ovrBadge">OVR 32</div>
    </div>

    <div class="morals">
      <div class="moral-chip">
        <span class="moral-label">Pastor</span>
        <span class="moral-val" id="mPastor">50</span>
      </div>
      <div class="moral-chip">
        <span class="moral-label">Torcida</span>
        <span class="moral-val" id="mTorcida">50</span>
      </div>
      <div class="moral-chip">
        <span class="moral-label">Técnico</span>
        <span class="moral-val" id="mTecnico">50</span>
      </div>
      <div class="moral-chip">
        <span class="moral-label">Time</span>
        <span class="moral-val" id="mTime">50</span>
      </div>
    </div>

    <div class="club-bar">
      <div class="club-identity">
        <span class="color-dots">
          <span class="dot" id="dot1"></span>
          <span class="dot" id="dot2"></span>
        </span>
        <span class="club-name-txt" id="clubTitle">Sem Clube</span>
      </div>
      <div class="standing-pill" id="standingInfo">-</div>
    </div>

    <div class="center-stage">
      <div class="event-card" id="eventCard"></div>
    </div>

    <div class="bottom-nav">
      <span class="season-info" id="seasonInfo">Temporada 1 • 1/4</span>
      <button class="btn-arrow" id="btnNext" title="Avançar" aria-label="Avançar">➔</button>
    </div>
  </main>
</div>

<script>

    {

      onYes: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: o bolso encheu e a resenha rendeu.", d: { time: 4, pastor: -6 } }
        : { ok: false, msg: "Deu errado: pegou mal demais com a igreja e com o treinador.", d: { pastor: -10, tecnico: -8, torcida: -5 } },
      onNo: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: manteve o compromisso e ganhou respeito.", d: { pastor: 8, tecnico: 5 } }
        : { ok: false, msg: "Deu errado: perdeu uma grana alta e ficou na bronca.", d: { time: -3 } }
    }
  ];

  const WORK_EVENTS = [
    {
      date: "08 de Abril",
      tag: "Firma",
      title: "Turno pesado no estoque / mercadinho",
      desc: "Carga pesada o dia inteiro enquanto na TV passa jogo do campeonato.",
      yesLabel: "Segurar o tranco e bater meta",
      noLabel: "Pedir mudança de função",
      onYes: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: fechou o dia firme, mas a saudade da bola aumentou.", d: { pastor: 4, vontadeFutebol: 18 } }
        : { ok: false, msg: "Deu errado: moído de cansaço e com mais vontade de voltar a jogar.", d: { time: -4, vontadeFutebol: 22 } },
      onNo: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: conseguiu um posto mais leve no turno.", d: { tecnico: 3, vontadeFutebol: 14 } }
        : { ok: false, msg: "Deu errado: gerou atrito com a chefia.", d: { torcida: -4, vontadeFutebol: 16 } }
    },
    {
      date: "22 de Julho",
      tag: "Peneira",
      title: "Rachão com olheiro no fim de semana",
      desc: "Surgiu teste no campo no mesmo dia em que pedem hora extra no serviço.",
      yesLabel: "Ir atrás da bola no teste",
      noLabel: "Ficar na hora extra garantida",
      onYes: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: correu tudo e chamou atenção de time pequeno.", d: { torcida: 6, ovr: 1, vontadeFutebol: 24 } }
        : { ok: false, msg: "Deu errado: faltou perna no fim e você saiu frustrado.", d: { tecnico: -4, vontadeFutebol: 18 } },
      onNo: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: extra garantiu o mês sem aperto.", d: { pastor: 5, vontadeFutebol: 12 } }
        : { ok: false, msg: "Deu errado: ver o campo de longe apertou a vontade de voltar.", d: { time: -3, vontadeFutebol: 26 } }
    },
    {
      date: "17 de Setembro",
      tag: "Rotina",
      title: "Cobrança apertada no atendimento",
      desc: "Dia corrido no balcão/entrega enquanto você lembra da última cobrança de falta.",
      yesLabel: "Levar na paciência e terminar o turno",
      noLabel: "Responder duro na hora",
      onYes: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: segurou a onda e manteve a cabeça fria.", d: { pastor: 6, vontadeFutebol: 16 } }
        : { ok: false, msg: "Deu errado: engoliu seco e cresceu a vontade de voltar aos gramados.", d: { torcida: -3, vontadeFutebol: 22 } },
      onNo: () => Math.random() < 0.5
        ? { ok: true, msg: "Deu certo: ninguém folgou e o expediente encerrou.", d: { time: 4, vontadeFutebol: 15 } }
        : { ok: false, msg: "Deu errado: clima pesado no trampo e saudade do vestiário.", d: { pastor: -6, vontadeFutebol: 26 } }
    }
  ];

  const state = {
    name: "Ronaldo Paz",
    age: 29,
    style: STYLES[0],
    ovr: 32,
    season: 1,
    step: 0,
    eventsPerSeason: 4,
    moral: { pastor: 50, torcida: 50, tecnico: 50, time: 50 },
    contract: null,
    playedMidTier: false,
    vontadeFutebol: 45,
    currentEvent: null,
    currentMarketOffer: null,
    resolved: false,
    lastOutcome: null,
    phase: "event"
  };

  let selectedStyleId = STYLES[0].id;
  let selectedStartId = START_CHOICES[0].id;

  function clamp(n, min = 0, max = 100) {
    return Math.max(min, Math.min(max, n));
  }

  function applyDelta(d = {}) {
    const styleMod = state.style ? state.style.mod : {};
    if (typeof d.pastor === "number") state.moral.pastor = clamp(state.moral.pastor + d.pastor + (styleMod.pastor || 0));
    if (typeof d.torcida === "number") state.moral.torcida = clamp(state.moral.torcida + d.torcida + (styleMod.torcida || 0));
    if (typeof d.tecnico === "number") state.moral.tecnico = clamp(state.moral.tecnico + d.tecnico + (styleMod.tecnico || 0));
    if (typeof d.time === "number") state.moral.time = clamp(state.moral.time + d.time + (styleMod.time || 0));
    if (typeof d.ovr === "number") state.ovr = clamp(state.ovr + d.ovr, 25, 85);
    if (typeof d.vontadeFutebol === "number") state.vontadeFutebol = clamp(state.vontadeFutebol + d.vontadeFutebol);
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function renderSetupOptions() {
    const styleBox = document.getElementById("styleOptions");
    styleBox.innerHTML = "";
    STYLES.forEach((st) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn" + (st.id === selectedStyleId ? " selected" : "");
      btn.innerHTML = `
        <div>
          <div class="opt-main">${st.label}</div>
          <div class="opt-sub">${st.desc}</div>
        </div>
      `;
      btn.onclick = () => {
        selectedStyleId = st.id;
        renderSetupOptions();
      };
      styleBox.appendChild(btn);
    });

    const startBox = document.getElementById("startOptions");
    startBox.innerHTML = "";
    START_CHOICES.forEach((op) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn" + (op.id === selectedStartId ? " selected" : "");
      btn.innerHTML = `
        <div>
          <div class="opt-main">
            <span class="color-dots">
              <span class="dot" style="background:${op.data.c1}"></span>
              <span class="dot" style="background:${op.data.c2}"></span>
            </span>
            <span>${op.label}</span>
          </div>
          <div class="opt-sub">${op.sub}</div>
        </div>
      `;
      btn.onclick = () => {
        selectedStartId = op.id;
        renderSetupOptions();
      };
      startBox.appendChild(btn);
    });
  }

  function pickEventForStep() {
    const isClub = state.contract && state.contract.type === "club";
    const pool = isClub ? FOOTBALL_EVENTS : WORK_EVENTS;
    state.currentEvent = pool[(state.season + state.step) % pool.length];
    state.resolved = false;
    state.lastOutcome = null;
    state.phase = "event";

    if (isClub && state.contract.teams) {
      const shift = Math.floor(Math.random() * 5) - 2;
      state.contract.pos = clamp(state.contract.pos + shift, 1, state.contract.teams);
    }
  }

  function generateMarketOffer() {
    const isJob = !state.contract || state.contract.type === "job";

    if (state.playedMidTier && Math.random() < 0.01) {
      const top = CLUBS_TOP[Math.floor(Math.random() * CLUBS_TOP.length)];
      return {
        date: "Fim de Temporada",
        tag: "Elite • 1/100",
        title: `Sondagem inesperada do ${top.name}`,
        desc: `Após rodar no segundo escalão, apareceu chance raríssima. Salário: R$ ${top.salary.toLocaleString("pt-BR")}/mês.`,
        target: {
          type: "club", name: top.name, tier: "top", c1: top.c1, c2: top.c2,
          salary: top.salary, teams: top.teams, pos: Math.floor(Math.random() * 12) + 6
        }
      };
    }

    if (isJob && state.vontadeFutebol >= 50) {
      const useMid = state.ovr >= 38 && Math.random() < 0.25;
      const list = useMid ? CLUBS_MID : START_CHOICES.filter((x) => x.data.type === "club").map((x) => x.data);
      const c = list[Math.floor(Math.random() * list.length)];
      return {
        date: "Fim de Temporada",
        tag: useMid ? "2º Escalão" : "Retorno à Bola",
        title: `Convite do ${c.name}`,
        desc: `A vontade de voltar a jogar falou alto. Salário: R$ ${c.salary.toLocaleString("pt-BR")}/mês.`,
        target: { ...c, pos: Math.floor(Math.random() * (c.teams - 2)) + 2 }
      };
    }

    if (!isJob && state.contract.tier === "low" && (state.ovr >= 36 || state.moral.tecnico >= 65) && Math.random() < 0.2) {
      const mid = CLUBS_MID[Math.floor(Math.random() * CLUBS_MID.length)];
      return {
        date: "Fim de Temporada",
        tag: "2º Escalão",
        title: `Proposta do ${mid.name}`,
        desc: `Sua passagem no time pequeno chamou atenção. Salário: R$ ${mid.salary.toLocaleString("pt-BR")}/mês.`,
        target: {
          type: "club", name: mid.name, tier: "mid", c1: mid.c1, c2: mid.c2,
          salary: mid.salary, teams: mid.teams, pos: Math.floor(Math.random() * 12) + 6
        }
      };
    }

    if (!isJob) {
      return {
        date: "Fim de Temporada",
        tag: "Contrato",
        title: `Renovação com ${state.contract.name}`,
        desc: `Clube oferece continuar por mais uma temporada pagando R$ ${state.contract.salary.toLocaleString("pt-BR")}/mês.`,
        target: { ...state.contract }
      };
    }

    const j = JOBS[Math.floor(Math.random() * JOBS.length)];
    return {
      date: "Fim de Temporada",
      tag: "Emprego",
      title: `Vaga no ${j.name}`,
      desc: `Sem proposta firme na bola agora, surge vaga pagando R$ ${j.salary.toLocaleString("pt-BR")}/mês.`,
      target: {
        type: "job", name: j.name, tier: "job", c1: j.c1, c2: j.c2,
        salary: j.salary, teams: null, pos: null
      }
    };
  }

  function renderGame() {
    document.getElementById("playerName").textContent = state.name;
    document.getElementById("playerMeta").textContent = `${state.age} anos • ${state.style.label}`;
    document.getElementById("ovrBadge").textContent = `OVR ${state.ovr}`;

    document.getElementById("mPastor").textContent = state.moral.pastor;
    document.getElementById("mTorcida").textContent = state.moral.torcida;
    document.getElementById("mTecnico").textContent = state.moral.tecnico;
    document.getElementById("mTime").textContent = state.moral.time;

    const c = state.contract;
    document.getElementById("dot1").style.background = c.c1;
    document.getElementById("dot2").style.background = c.c2;
    document.getElementById("clubTitle").textContent = c.name;
    document.getElementById("standingInfo").textContent =
      c.type === "club" && c.pos ? `${c.pos}º / ${c.teams} times` : "-";

    document.getElementById("seasonInfo").textContent =
      state.phase === "event"
        ? `Temporada ${state.season} • ${state.step + 1}/${state.eventsPerSeason}`
        : `Temporada ${state.season} • Encerramento`;

    const card = document.getElementById("eventCard");
    const btnNext = document.getElementById("btnNext");
    const item = state.phase === "event" ? state.currentEvent : state.currentMarketOffer;

    let outcomeHtml = "";
    if (state.resolved && state.lastOutcome) {
      outcomeHtml = `<div class="outcome-box ${state.lastOutcome.ok ? "" : "fail"}">${state.lastOutcome.msg}</div>`;
    }

    if (state.phase === "event") {
      card.innerHTML = `
        <div class="event-header">
          <span>${item.date}</span>
          <span class="tag">${item.tag}</span>
        </div>
        <h2 class="event-title">${item.title}</h2>
        <p class="event-desc">${item.desc}</p>
        ${!state.resolved ? `
          <div class="choices">
            <button class="btn-choice yes" id="btnYes">${item.yesLabel}</button>
            <button class="btn-choice no" id="btnNo">${item.noLabel}</button>
          </div>
        ` : outcomeHtml}
      `;

      btnNext.disabled = !state.resolved;

      if (!state.resolved) {
        document.getElementById("btnYes").onclick = () => {
          const res = item.onYes();
          applyDelta(res.d);
          state.lastOutcome = res;
          state.resolved = true;
          renderGame();
        };
        document.getElementById("btnNo").onclick = () => {
          const res = item.onNo();
          applyDelta(res.d);
          state.lastOutcome = res;
          state.resolved = true;
          renderGame();
        };
      }
    } else {
      card.innerHTML = `
        <div class="event-header">
          <span>${item.date}</span>
          <span class="tag">${item.tag}</span>
        </div>
        <h2 class="event-title">${item.title}</h2>
        <p class="event-desc">${item.desc}</p>
        ${!state.resolved ? `
          <div class="choices">
            <button class="btn-choice yes" id="btnAccept">Aceitar</button>
            <button class="btn-choice no" id="btnDecline">Recusar</button>
          </div>
        ` : outcomeHtml}
      `;

      btnNext.disabled = !state.resolved;

      if (!state.resolved) {
        document.getElementById("btnAccept").onclick = () => {
          state.contract = { ...item.target };
          if (state.contract.tier === "mid") state.playedMidTier = true;
          if (state.contract.type === "club") state.vontadeFutebol = 20;
          state.lastOutcome = {
            ok: true,
            msg: `Fechado: novo rumo em ${state.contract.name} (R$ ${state.contract.salary.toLocaleString("pt-BR")}/mês).`
          };
          state.resolved = true;
          renderGame();
        };
        document.getElementById("btnDecline").onclick = () => {
          if (item.target.type === "job") {
            state.vontadeFutebol = clamp(state.vontadeFutebol + 10);
          }
          state.lastOutcome = {
            ok: false,
            msg: "Recusado: você preferiu esperar os próximos passos."
          };
          state.resolved = true;
          renderGame();
        };
      }
    }
  }

  function advance() {
    if (!state.resolved) return;
    if (state.phase === "event") {
      state.step += 1;
      if (state.step < state.eventsPerSeason) {
        pickEventForStep();
      } else {
        state.phase = "market";
        state.resolved = false;
        state.lastOutcome = null;
        state.currentMarketOffer = generateMarketOffer();
      }
      renderGame();
    } else {
      state.season += 1;
      state.age += 1;
      state.step = 0;
      pickEventForStep();
      renderGame();
    }
  }

  document.getElementById("btnGoSetup").addEventListener("click", () => {
    renderSetupOptions();
    showScreen("setupScreen");
  });

  document.getElementById("btnStartCareer").addEventListener("click", () => {
    const rawName = document.getElementById("inputName").value.trim();
    const chosenStyle = STYLES.find((s) => s.id === selectedStyleId) || STYLES[0];
    const chosenStart = START_CHOICES.find((o) => o.id === selectedStartId) || START_CHOICES[0];

    state.name = rawName || "Bagre da Vila";
    state.style = chosenStyle;
    state.moral = { ...chosenStyle.init };
    state.contract = { ...chosenStart.data };
    state.season = 1;
    state.step = 0;
    state.ovr = 32;
    state.playedMidTier = false;
    state.vontadeFutebol = chosenStart.data.type === "job" ? 55 : 25;

    pickEventForStep();
    showScreen("gameScreen");
    renderGame();
  });

  document.getElementById("btnNext").addEventListener("click", advance);
</script>
</body>
</html>
